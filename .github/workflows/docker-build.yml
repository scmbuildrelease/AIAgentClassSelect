name: Build Docker images

# Builds the optional backend/frontend viewer images when their code changes.
# Images are multi-platform (linux/amd64 + linux/arm64, e.g. Apple Silicon): QEMU emulates arm64 on the
# amd64 runner and Buildx publishes one image index per tag.
on:
  push:
    branches: [main]
    paths: ["backend/**", "frontend/**", "activity_tracker/**", "config/settings.json"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get short SHA
        run: echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aiagentclassselect-backend:latest
            ghcr.io/${{ github.repository_owner }}/aiagentclassselect-backend:main-${{ env.SHORT_SHA }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/aiagentclassselect-frontend:latest
            ghcr.io/${{ github.repository_owner }}/aiagentclassselect-frontend:main-${{ env.SHORT_SHA }}
