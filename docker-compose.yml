version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    # AI Assistant (POST /agent/chat): the Ollama app already running on the host, not a second instance.
    # Override with e.g. AI_MODEL=qwen2.5:7b docker compose up, or AI_ENABLED=false to turn it off.
    environment:
      - AI_ENABLED=${AI_ENABLED:-true}
      - AI_PROVIDER=ollama
      - AI_MODEL=${AI_MODEL:-qwen2.5:1.5b}
      - AI_BASE_URL=${AI_BASE_URL:-http://host.docker.internal:11434}
    extra_hosts:
      - "host.docker.internal:host-gateway"  # built in on Docker Desktop (Mac); needed on Linux

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      - WDS_SOCKET_PORT=0
